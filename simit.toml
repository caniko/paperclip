[ci]
platform = "github"
provider = "actions"
runtime = "nix"
runner = "ubuntu-24.04"
nix_builds = [".#checks.x86_64-linux.hermes-worker-env"]

[ci.nix_build]
only = true
# Qualify each change once: the integration branch keeps its post-merge push
# run while pull requests qualify their own heads. A wildcard here also ran a
# push for every PR head in the same concurrency group, so the PR run
# cancelled it and left a red cancelled check.
push_branches = ["integration/nixpkgs-567242-all-prs-20260930"]
timeout_minutes = 30
max_parallel = 1
max_jobs = 1
cores = 2
capture_results = true
artifact_retention_days = 31
extra_setup = [
  "nix run github:caniko/simit/7d6783ab1a99fb675b273e214df77d378e6735ab -- init ci --platform github --ci-provider actions --runtime nix --check --diff",
]

[release.artifacts]
substituters = ["https://cache.nixos.org"]
trusted_public_keys = ["cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="]
