name: Exact-head required environment profiles

on:
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: required-profiles-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: Exact head / required ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: tailscale-mock
            runner: ubuntu-24.04
          - profile: macos
            runner: macos-15
          - profile: windows
            runner: windows-2025
          - profile: nonlinux-containment-denial
            runner: macos-15
          - profile: import-benchmark
            runner: ubuntu-24.04
          - profile: search-benchmark
            runner: ubuntu-24.04
          - profile: otel-absent
            runner: ubuntu-24.04
          - profile: otel-sdk
            runner: ubuntu-24.04
          - profile: sentry-sdk
            runner: ubuntu-24.04
          - profile: linux-containment
            runner: ubuntu-24.04
          - profile: runnerd
            runner: ubuntu-24.04
          - profile: runner-package
            runner: ubuntu-24.04
          - profile: warm-transition
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Bind the actual source and isolated environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/required-profile"
          mkdir -p "$EVIDENCE" "$RUNNER_TEMP/profile-instance" "$RUNNER_TEMP/profile-tmp"
          printf '%s\n' "EVIDENCE=$EVIDENCE" "NODE_ENV=test" "PAPERCLIP_HOME=$RUNNER_TEMP/profile-instance" "PAPERCLIP_CONFIG=$RUNNER_TEMP/profile-instance/config.json" "TMPDIR=$RUNNER_TEMP/profile-tmp" >> "$GITHUB_ENV"
          python .github/scripts/qualification-evidence.py initialize "$EVIDENCE"
      - name: Install frozen workspace dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install.log"
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          pnpm run preflight:workspace-links
      - name: Verify mocked-provider evidence and environment boundaries
        if: matrix.profile == 'tailscale-mock'
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/qualification-node-junit-reporter.mjs --test-reporter-destination="$EVIDENCE/tailscale-policy.xml" .github/scripts/tests/qualification-profiles.test.mjs .github/scripts/tests/qualification-tailscale-mock.test.mjs 2>&1 | tee "$EVIDENCE/tailscale-policy.log"
      - name: Prepare the separately locked optional SDK
        if: matrix.profile == 'otel-sdk' || matrix.profile == 'sentry-sdk'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          node .github/scripts/prepare-qualification-sdk.mjs "$PROFILE" "$RUNNER_TEMP/profile-sdk" "$EVIDENCE" 2>&1 | tee "$EVIDENCE/sdk-install.log"
      - name: Prepare actual Linux namespace containment
        if: matrix.profile == 'linux-containment'
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          bash .github/scripts/prepare-candidate-sandbox.sh 2>&1 | tee "$EVIDENCE/containment-preparation.log"
      - name: Prepare actual native PostgreSQL prerequisites
        if: matrix.profile == 'runnerd' || matrix.profile == 'warm-transition' || matrix.profile == 'runner-package' || matrix.profile == 'tailscale-mock'
        run: |
          set -euo pipefail
          node .github/scripts/prepare-source-native-tools.mjs "$EVIDENCE" 2>&1 | tee "$EVIDENCE/native-tools.log"
      - name: Build the actual Linux peer-credential bridge for the mocked provider
        if: matrix.profile == 'tailscale-mock'
        run: |
          set -euo pipefail
          pnpm --filter @paperclipai/tailscale-https-broker build 2>&1 | tee "$EVIDENCE/broker-build.log"
      - name: Build the exact-source native runner with its declared toolchain
        if: matrix.profile == 'runnerd' || matrix.profile == 'warm-transition' || matrix.profile == 'runner-package'
        working-directory: packages/paperclip-runner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/paperclip-runner/runner/target
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          rustup show
          if [ "$PROFILE" = runner-package ]; then
            cargo build --manifest-path runner/Cargo.toml --locked --workspace --bins --jobs 2 2>&1 | tee "$EVIDENCE/runner-build.log"
            pnpm run ensure:eval-build-deps 2>&1 | tee "$EVIDENCE/eval-build-deps.log"
          else
            cargo build --manifest-path runner/Cargo.toml --locked --bin paperclip-runnerd --bin fake-codex-app-server --jobs 2 2>&1 | tee "$EVIDENCE/runner-build.log"
          fi
      - name: Prepare the actual locked Pi snapshot for the complete Runner package
        if: matrix.profile == 'runner-package'
        run: |
          set -euo pipefail
          node packages/paperclip-runner/scripts/materialize-pi-distribution.mjs "$RUNNER_TEMP/profile-pi" 2>&1 | tee "$EVIDENCE/pi-preparation.log"
          cp "$RUNNER_TEMP/profile-pi/pi-distribution.json" "$EVIDENCE/pi-distribution.json"
          cp "$RUNNER_TEMP/profile-pi/native-closure.json" "$EVIDENCE/pi-native-closure.json"
          printf '%s\n' "PAPERCLIP_TEST_PI_DISTRIBUTION_ROOT=$RUNNER_TEMP/profile-pi" >> "$GITHUB_ENV"
      - name: Verify all four read-only Stop fixture combinations from source
        if: matrix.profile == 'runnerd'
        working-directory: packages/paperclip-runner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/paperclip-runner/runner/target
        run: |
          set -euo pipefail
          cargo test --manifest-path runner/Cargo.toml --locked -p paperclip-runner-core --test codex_provider --jobs 2 stop_fixture_completes_only_opted_in_read_only_toolless_probes -- --exact --test-threads=1 2>&1 | tee "$EVIDENCE/stop-fixture.log"
      - name: Build and prepare the real remote continuity fixture
        if: matrix.profile == 'runnerd'
        working-directory: packages/paperclip-runner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/paperclip-runner/runner/target
        run: |
          set -euo pipefail
          cargo build --manifest-path runner/Cargo.toml --release --locked --bin paperclip-runnerd --bin fake-codex-app-server --jobs 2 2>&1 | tee "$EVIDENCE/remote-runner-build.log"
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/prepare-remote-continuity.sh "$EVIDENCE" 2>&1 | tee "$EVIDENCE/remote-continuity-preparation.log"
      - name: Capture original transient and managed loss windows on this runner
        if: matrix.profile == 'warm-transition'
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/warm-fixtures/transient" "$EVIDENCE/warm-fixtures/managed"
          export PAPERCLIP_ATTACH_TRANSITION_FIXTURE_DIRECTORY="$EVIDENCE/warm-fixtures/transient"
          export PAPERCLIP_ATTACH_TRANSITION_FIXTURE_SCOPE=transient
          pnpm --filter @paperclipai/paperclip-runner exec vitest run src/live/runnerd-codex-transport.test.ts -t '^recovers a warm attachment with a fresh controller and runner \((before-result|after-result|after-activation|before-confirmation|after-confirmation), routed=true, fault=none, followup=undefined, external=undefined, prepared=undefined\)$' --no-file-parallelism --maxWorkers=1 --retry=0 --allowOnly=false --reporter=default --reporter="$GITHUB_WORKSPACE/scripts/qualification-junit-reporter.mjs" --outputFile.junit="$EVIDENCE/transient-producer.junit" 2>&1 | tee "$EVIDENCE/transient-producer.log"
          export PAPERCLIP_ATTACH_TRANSITION_FIXTURE_DIRECTORY="$EVIDENCE/warm-fixtures/managed"
          export PAPERCLIP_ATTACH_TRANSITION_FIXTURE_SCOPE=managed
          pnpm --filter @paperclipai/paperclip-runner exec vitest run src/live/runnerd-codex-transport.test.ts -t '^recovers a warm attachment with a fresh controller and runner \(before-result, routed=true, fault=none, followup=undefined, external=undefined, prepared=undefined\)$' --no-file-parallelism --maxWorkers=1 --retry=0 --allowOnly=false --reporter=default --reporter="$GITHUB_WORKSPACE/scripts/qualification-junit-reporter.mjs" --outputFile.junit="$EVIDENCE/managed-producer.junit" 2>&1 | tee "$EVIDENCE/managed-producer.log"
          printf '%s\n' "PAPERCLIP_WARM_TRANSITION_FIXTURE_DIRECTORY=$EVIDENCE/warm-fixtures/transient" "PAPERCLIP_WARM_TRANSITION_MANAGED_FIXTURE_DIRECTORY=$EVIDENCE/warm-fixtures/managed" >> "$GITHUB_ENV"
      - name: Execute every source-mapped profile case once
        # A hung runnerd scenario must end the step so the profile log and evidence still upload.
        timeout-minutes: ${{ matrix.profile == 'runnerd' && 45 || 110 }}
        env:
          PROFILE: ${{ matrix.profile }}
          PORTABILITY_IMPORT_BENCH: ${{ matrix.profile == 'import-benchmark' && '1' || '' }}
          SEARCH_EVAL_SCALE: ${{ matrix.profile == 'search-benchmark' && '1' || '' }}
          PAPERCLIP_FINAL_BURST_BENCHMARK: ${{ matrix.profile == 'runner-package' && '1' || '' }}
          PAPERCLIP_FINAL_BURST_REPETITIONS: ${{ matrix.profile == 'runner-package' && '1' || '' }}
          PAPERCLIP_REQUIRE_SENTRY_TEST_SDK: ${{ matrix.profile == 'sentry-sdk' && '1' || '' }}
          PAPERCLIP_TEST_BWRAP: ${{ matrix.profile == 'linux-containment' && '/usr/bin/bwrap' || '' }}
          PAPERCLIP_TEST_SANDBOX_BUILD: ${{ matrix.profile == 'linux-containment' && '1' || '' }}
          PAPERCLIP_TEST_TAILSCALE_MOCK: ${{ matrix.profile == 'tailscale-mock' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "$PROFILE" = runnerd ]; then
            export PAPERCLIP_WARM_TRANSITION_EXECUTION_EVIDENCE="$EVIDENCE/warm-transition-execution"
            # Five minutes before the 45-minute cap, retain process, container and worker CPU evidence.
            bash .github/scripts/runnerd-hang-diagnostics.sh "$EVIDENCE" 2400 < /dev/null > "$EVIDENCE/hang-diagnostics.log" 2>&1 &
            watchdog=$!
            trap 'kill "$watchdog" 2>/dev/null || true' EXIT
          fi
          node .github/scripts/run-qualification-profile.mjs "$PROFILE" "$EVIDENCE" 2>&1 | tee "$EVIDENCE/profile.log"
          python .github/scripts/verify_profile_evidence.py "$EVIDENCE"
      - name: Release only preparation-owned SDK links
        if: always() && (matrix.profile == 'otel-sdk' || matrix.profile == 'sentry-sdk')
        run: |
          if [ -f "$EVIDENCE/sdk.json" ]; then node .github/scripts/cleanup-qualification-sdk.mjs "$EVIDENCE"; fi
      - name: Retain and release the disposable remote continuity container
        if: always() && matrix.profile == 'runnerd'
        run: |
          set -euo pipefail
          if [ -f "$EVIDENCE/remote-continuity-container.id" ]; then
            container="$(cat "$EVIDENCE/remote-continuity-container.id")"
            test "$(docker inspect --format '{{ index .Config.Labels "paperclip.qualification.run" }}' "$container")" = "$GITHUB_RUN_ID"
            docker logs "$container" > "$EVIDENCE/remote-continuity-container.log" 2>&1
            docker inspect "$container" > "$EVIDENCE/remote-continuity-container.json"
            docker rm --force "$container"
          fi
      - name: Seal the original raw and strict profile reports
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: python .github/scripts/qualification-evidence.py seal "$EVIDENCE" "$OUTCOME" --strict-reports
      - name: Retain the original attempt-1 environment proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-profile-${{ matrix.profile }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          retention-days: 32
          if-no-files-found: error
          # Frozen runner snapshots can retain hidden atomic-write files in the receipt.
          include-hidden-files: true
          path: ${{ runner.temp }}/required-profile/

  retention:
    name: Exact head / required profile retention
    needs: profile
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_OUTCOME: ${{ needs.profile.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify actual provider expiry and SHA-256
        run: python .github/scripts/qualification-evidence.py artifacts required-profile- 13 profile-retention.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: environment-retention-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          retention-days: 32
          if-no-files-found: error
          path: profile-retention.json
      - name: Require all mandatory profiles and the retained audit
        run: |
          test "$PROFILE_OUTCOME" = success
          python .github/scripts/qualification-evidence.py artifacts environment-retention- 1 audit-retention.json
