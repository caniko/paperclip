name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # Expanded policy qualified on attempt 1 in run 39474414257 (511 source-bound cases).
    # Preserve the Stop commands qualified in run 39336767061; harness 2acfb196e3 qualified on attempt 1 in run 40941483197.
    # a7ce46964f is that workflow plus lockfile changes accepted as CI's own resolution (branch ci/pr-trusted-pin-lock-ci-resolution).
    uses: caniko/paperclip/.github/workflows/pr-trusted.yml@a7ce46964fc64af6711b50107bdb3dac3952c03e
