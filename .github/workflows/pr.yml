name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Prepared Native Stop qualified on attempt 1 in run 39336767061.
    # Keep that workflow and its independently pinned Stop harness immutable.
    uses: caniko/paperclip/.github/workflows/pr-trusted.yml@76e683f90c801370d6bb230be0284682472633da
