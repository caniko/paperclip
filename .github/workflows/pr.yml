name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Expanded policy qualified on attempt 1 in run 39474414257 (511 source-bound cases).
    # Preserve the Stop commands qualified in run 39336767061 and their pinned harness.
    uses: caniko/paperclip/.github/workflows/pr-trusted.yml@1c37302206955723ca010ddf22b073f306c83f86
